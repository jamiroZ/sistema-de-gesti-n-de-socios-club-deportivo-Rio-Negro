services:
  postgres:
    build: .
    container_name: club_deportivo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: club_deportivo
    ports:
      - "5435:5432"
    volumes:
      - club_deportivo_data:/var/lib/postgresql

volumes:
  club_deportivo_data: